name: Nai Mobile Flutter checks
on:
  push:
    branches: [master]
    paths:
      - 'nai-mobile/**'
      - '.github/workflows/nai-mobile.yml'
  workflow_dispatch:

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: nai-mobile
        run: flutter pub get
      - name: Analyze Dart
        working-directory: nai-mobile
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        working-directory: nai-mobile
        run: flutter test
      - name: Build debug APK
        working-directory: nai-mobile
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nai-mobile-debug-apk
          path: nai-mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
